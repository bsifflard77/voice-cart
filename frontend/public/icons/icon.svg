<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0ea5e9"/>

  <!-- Shopping Cart -->
  <g transform="translate(80, 100)">
    <!-- Cart Body -->
    <path d="M 0 40 L 30 40 L 80 200 L 280 200 L 320 80 L 100 80"
          stroke="white" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cart Bottom -->
    <line x1="80" y1="200" x2="280" y2="200" stroke="white" stroke-width="20" stroke-linecap="round"/>

    <!-- Wheels -->
    <circle cx="120" cy="260" r="25" fill="white"/>
    <circle cx="240" cy="260" r="25" fill="white"/>
  </g>

  <!-- Microphone Icon -->
  <g transform="translate(280, 80)">
    <!-- Mic Body -->
    <rect x="35" y="20" width="60" height="100" rx="30" fill="white"/>

    <!-- Mic Stand -->
    <path d="M 65 120 Q 65 180 20 180 M 65 180 L 110 180"
          stroke="white" stroke-width="15" fill="none" stroke-linecap="round"/>

    <!-- Sound Waves -->
    <path d="M 140 50 Q 160 70 140 90" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 160 40 Q 190 70 160 100" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
</svg>

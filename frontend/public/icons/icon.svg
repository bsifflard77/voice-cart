<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="voicecartzGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#voicecartzGradient)"/>

  <!-- Sound Waves (7 vertical bars forming waveform pattern) -->
  <g transform="translate(256, 200)" fill="white">
    <!-- Leftmost bar (shortest) -->
    <rect x="-96" y="-20" width="12" height="40" rx="6"/>

    <!-- Second from left (medium) -->
    <rect x="-68" y="-28" width="12" height="56" rx="6"/>

    <!-- Third from left (tall) -->
    <rect x="-40" y="-38" width="12" height="76" rx="6"/>

    <!-- Center bar (tallest) -->
    <rect x="-6" y="-48" width="12" height="96" rx="6"/>

    <!-- Third from right (tall) -->
    <rect x="28" y="-38" width="12" height="76" rx="6"/>

    <!-- Second from right (medium) -->
    <rect x="56" y="-28" width="12" height="56" rx="6"/>

    <!-- Rightmost bar (shortest) -->
    <rect x="84" y="-20" width="12" height="40" rx="6"/>
  </g>

  <!-- Shopping Cart -->
  <g transform="translate(256, 310)" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cart back vertical line -->
    <line x1="-70" y1="-25" x2="-70" y2="5"/>

    <!-- Cart top/handle -->
    <path d="M -70 -25 L -50 -25"/>

    <!-- Cart basket outline -->
    <path d="M -50 -25 L -35 25 L 50 25 L 62 -10 L -45 -10"/>

    <!-- Cart bottom -->
    <line x1="-35" y1="25" x2="50" y2="25"/>

    <!-- Left wheel -->
    <circle cx="-15" cy="50" r="10" fill="white" stroke="none"/>

    <!-- Right wheel -->
    <circle cx="35" cy="50" r="10" fill="white" stroke="none"/>
  </g>
</svg>
